[package]
name = "repo-mapper-rs"
version = "0.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "repo_mapper_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
colored = "3.0.0"
itertools = "0.14.0"
pyo3 = "0.25.0"
rayon = "1.10.0"
regex = "1.11.1"
unicode-width = "0.2.2"
walkdir = "2.5.0"


[dev-dependencies]
criterion = "0.5.1"
test-case = "3.3.1"

[[bench]]
name = "repo_mapper_rs_benchmark"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true


[lints.clippy]
pedantic = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
